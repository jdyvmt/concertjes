<!DOCTYPE html>
<html lang="nl" class="h-full bg-slate-950 text-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Concertjes • Jordy's lijstje</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            500: '#22c55e',
                            600: '#16a34a',
                            700: '#15803d',
                            900: '#14532d',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        /* Custom scrollbar for better aesthetics */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0f172a;
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #475569;
        }
    </style>
</head>
<body class="min-h-full flex flex-col bg-slate-950 text-slate-100 antialiased selection:bg-brand-500 selection:text-black">

    <!-- Top Navigation Header -->
    <header class="sticky top-0 z-30 border-b border-slate-800/80 bg-slate-950/80 backdrop-blur-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between gap-4">
            <!-- Branding -->
            <div class="flex items-center gap-3">
                <div class="w-11 h-11 rounded-2xl bg-gradient-to-tr from-brand-600 to-emerald-400 flex items-center justify-center shadow-lg shadow-brand-500/20 text-slate-950">
                    <i data-lucide="music" class="w-6 h-6 stroke-[2.5]"></i>
                </div>
                <div>
                    <h1 class="text-2xl font-black tracking-tight text-white flex items-center gap-2">
                        Concertjes
                        <span class="text-xs font-semibold px-2.5 py-0.5 rounded-full bg-brand-500/10 text-brand-400 border border-brand-500/20">v2.0</span>
                    </h1>
                    <p class="text-xs text-slate-400 font-medium">Jordy's lijstje</p>
                </div>
            </div>

            <!-- Quick Action Button -->
            <button onclick="openAddModal()" class="inline-flex items-center gap-2 px-4 py-2.5 rounded-xl bg-brand-500 hover:bg-brand-600 text-slate-950 font-bold text-sm shadow-md shadow-brand-500/20 transition duration-200 active:scale-95">
                <i data-lucide="plus" class="w-4 h-4 stroke-[3]"></i>
                <span>Nieuw Concert</span>
            </button>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8">

        <!-- Stats Overview Grid -->
        <section class="grid grid-cols-2 md:grid-cols-4 gap-4">
            <div class="p-5 rounded-2xl bg-slate-900/60 border border-slate-800/80 flex items-center gap-4">
                <div class="w-12 h-12 rounded-xl bg-indigo-500/10 text-indigo-400 flex items-center justify-center shrink-0">
                    <i data-lucide="ticket" class="w-6 h-6"></i>
                </div>
                <div>
                    <p class="text-xs font-medium text-slate-400 uppercase tracking-wider">Totaal Concerten</p>
                    <h3 id="stat-total" class="text-2xl font-bold text-white mt-0.5">0</h3>
                </div>
            </div>

            <div class="p-5 rounded-2xl bg-slate-900/60 border border-slate-800/80 flex items-center gap-4">
                <div class="w-12 h-12 rounded-xl bg-purple-500/10 text-purple-400 flex items-center justify-center shrink-0">
                    <i data-lucide="mic" class="w-6 h-6"></i>
                </div>
                <div>
                    <p class="text-xs font-medium text-slate-400 uppercase tracking-wider">Top Artiest</p>
                    <h3 id="stat-top-artist" class="text-2xl font-bold text-white mt-0.5 truncate max-w-[130px] sm:max-w-[160px]">-</h3>
                </div>
            </div>

            <div class="p-5 rounded-2xl bg-slate-900/60 border border-slate-800/80 flex items-center gap-4">
                <div class="w-12 h-12 rounded-xl bg-amber-500/10 text-amber-400 flex items-center justify-center shrink-0">
                    <i data-lucide="map-pin" class="w-6 h-6"></i>
                </div>
                <div>
                    <p class="text-xs font-medium text-slate-400 uppercase tracking-wider">Favoriete Zaal</p>
                    <h3 id="stat-top-venue" class="text-2xl font-bold text-white mt-0.5 truncate max-w-[130px] sm:max-w-[160px]">-</h3>
                </div>
            </div>

            <div class="p-5 rounded-2xl bg-slate-900/60 border border-slate-800/80 flex items-center gap-4">
                <div class="w-12 h-12 rounded-xl bg-emerald-500/10 text-emerald-400 flex items-center justify-center shrink-0">
                    <i data-lucide="camera" class="w-6 h-6"></i>
                </div>
                <div>
                    <p class="text-xs font-medium text-slate-400 uppercase tracking-wider">Met Foto's</p>
                    <h3 id="stat-with-photos" class="text-2xl font-bold text-white mt-0.5">0</h3>
                </div>
            </div>
        </section>

        <!-- Filters & Search Bar -->
        <section class="flex flex-col md:flex-row gap-4 items-stretch md:items-center justify-between">
            <!-- Search input -->
            <div class="relative flex-1">
                <i data-lucide="search" class="w-5 h-5 absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
                <input type="text" id="search-input" oninput="renderConcerts()" placeholder="Zoek op artiest, locatie, stad..." class="w-full pl-11 pr-4 py-2.5 rounded-xl bg-slate-900/80 border border-slate-800 text-sm placeholder:text-slate-500 focus:outline-none focus:border-brand-500 focus:ring-1 focus:ring-brand-500 transition">
            </div>

            <!-- Sorting & Filter Options -->
            <div class="flex items-center gap-3">
                <div class="relative flex-1 md:w-48">
                    <select id="sort-select" onchange="renderConcerts()" class="w-full appearance-none pl-3.5 pr-9 py-2.5 rounded-xl bg-slate-900/80 border border-slate-800 text-sm text-slate-300 focus:outline-none focus:border-brand-500 transition">
                        <option value="date-desc">Nieuwste eerst</option>
                        <option value="date-asc">Oudste eerst</option>
                        <option value="rating-desc">Hoogste score</option>
                        <option value="artist-asc">Artiest (A-Z)</option>
                    </select>
                    <i data-lucide="chevron-down" class="w-4 h-4 absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none"></i>
                </div>

                <button id="photo-filter-btn" onclick="togglePhotoFilter()" class="flex items-center gap-2 px-3.5 py-2.5 rounded-xl bg-slate-900/80 border border-slate-800 text-sm font-medium text-slate-300 hover:text-white hover:bg-slate-800 transition">
                    <i data-lucide="image" class="w-4 h-4 text-slate-400"></i>
                    <span class="hidden sm:inline">Met foto</span>
                </button>
            </div>
        </section>

        <!-- Concert Grid / List -->
        <section id="concerts-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Dynamic Content -->
        </section>

        <!-- Empty State (hidden by default) -->
        <div id="empty-state" class="hidden text-center py-16 px-4 rounded-3xl bg-slate-900/40 border border-dashed border-slate-800">
            <div class="w-16 h-16 rounded-2xl bg-slate-800/60 text-slate-400 flex items-center justify-center mx-auto mb-4">
                <i data-lucide="disc" class="w-8 h-8"></i>
            </div>
            <h3 class="text-lg font-bold text-white mb-1">Geen concerten gevonden</h3>
            <p class="text-slate-400 text-sm max-w-sm mx-auto mb-6">Voeg je eerste herinnering toe of pas je zoekopdracht aan.</p>
            <button onclick="openAddModal()" class="inline-flex items-center gap-2 px-4 py-2 rounded-xl bg-brand-500 text-slate-950 font-bold text-sm hover:bg-brand-600 transition">
                <i data-lucide="plus" class="w-4 h-4"></i>
                <span>Voeg Concert Toe</span>
            </button>
        </div>

    </main>

    <!-- Modal for Adding / Editing Concert -->
    <div id="concert-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70 backdrop-blur-sm hidden opacity-0 transition-opacity duration-200">
        <div class="bg-slate-900 border border-slate-800 rounded-3xl w-full max-w-xl max-h-[90vh] overflow-y-auto shadow-2xl p-6 sm:p-8 space-y-6 relative transform scale-95 transition-transform duration-200" id="modal-container">
            
            <div class="flex items-center justify-between border-b border-slate-800 pb-4">
                <h2 id="modal-title" class="text-xl font-bold text-white">Nieuw Concert Toevoegen</h2>
                <button onclick="closeModal()" class="p-2 text-slate-400 hover:text-white rounded-xl hover:bg-slate-800 transition">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>

            <form id="concert-form" onsubmit="handleFormSubmit(event)" class="space-y-4">
                <input type="hidden" id="concert-id">

                <!-- Artist -->
                <div>
                    <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">Artiest / Band *</label>
                    <input type="text" id="form-artist" required placeholder="bijv. Arctic Monkeys" class="w-full px-4 py-2.5 rounded-xl bg-slate-950 border border-slate-800 text-sm text-white focus:outline-none focus:border-brand-500">
                </div>

                <!-- Venue & City Grid -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">Zaal / Festival *</label>
                        <input type="text" id="form-venue" required placeholder="bijv. Werchter / AB" class="w-full px-4 py-2.5 rounded-xl bg-slate-950 border border-slate-800 text-sm text-white focus:outline-none focus:border-brand-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">Stad / Land</label>
                        <input type="text" id="form-location" placeholder="bijv. Brussel, België" class="w-full px-4 py-2.5 rounded-xl bg-slate-950 border border-slate-800 text-sm text-white focus:outline-none focus:border-brand-500">
                    </div>
                </div>

                <!-- Date & Rating -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">Datum *</label>
                        <input type="date" id="form-date" required class="w-full px-4 py-2.5 rounded-xl bg-slate-950 border border-slate-800 text-sm text-white focus:outline-none focus:border-brand-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">Beoordeling (1-5)</label>
                        <select id="form-rating" class="w-full px-4 py-2.5 rounded-xl bg-slate-950 border border-slate-800 text-sm text-white focus:outline-none focus:border-brand-500">
                            <option value="5">⭐⭐⭐⭐⭐ (5/5)</option>
                            <option value="4">⭐⭐⭐⭐ (4/5)</option>
                            <option value="3">⭐⭐⭐ (3/5)</option>
                            <option value="2">⭐⭐ (2/5)</option>
                            <option value="1">⭐ (1/5)</option>
                        </select>
                    </div>
                </div>

                <!-- Photo Upload Field -->
                <div>
                    <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">Concertfoto's Uploaden</label>
                    <div class="relative border-2 border-dashed border-slate-800 hover:border-brand-500/50 rounded-2xl p-4 text-center transition bg-slate-950/50">
                        <input type="file" id="form-photos" accept="image/*" multiple onchange="handlePhotoSelect(event)" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer">
                        <div class="flex flex-col items-center justify-center space-y-1">
                            <i data-lucide="upload-cloud" class="w-8 h-8 text-slate-400"></i>
                            <p class="text-xs font-medium text-slate-300">Klik of sleep afbeeldingen hierheen</p>
                            <p class="text-[10px] text-slate-500">PNG, JPG, WEBP toegestaan (Max 3MB per foto)</p>
                        </div>
                    </div>
                    <!-- Photo Preview Container in Form -->
                    <div id="form-photo-previews" class="flex flex-wrap gap-2 mt-3"></div>
                </div>

                <!-- Notes / Memories -->
                <div>
                    <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">Notities / Setlist / Herinneringen</label>
                    <textarea id="form-notes" rows="3" placeholder="Wat was de beste song? Wie ging er mee?..." class="w-full px-4 py-2.5 rounded-xl bg-slate-950 border border-slate-800 text-sm text-white focus:outline-none focus:border-brand-500"></textarea>
                </div>

                <!-- Action Buttons -->
                <div class="flex items-center justify-end gap-3 pt-4 border-t border-slate-800">
                    <button type="button" onclick="closeModal()" class="px-5 py-2.5 rounded-xl border border-slate-800 text-slate-300 hover:bg-slate-800 font-medium text-sm transition">Annuleren</button>
                    <button type="submit" class="px-5 py-2.5 rounded-xl bg-brand-500 hover:bg-brand-600 text-slate-950 font-bold text-sm transition shadow-lg shadow-brand-500/20">Opslaan</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal for Photo Preview Viewer -->
    <div id="photo-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/90 backdrop-blur-md hidden opacity-0 transition-opacity duration-200" onclick="closePhotoModal()">
        <div class="relative max-w-4xl max-h-[90vh] flex flex-col items-center" onclick="event.stopPropagation()">
            <button onclick="closePhotoModal()" class="absolute -top-12 right-0 text-slate-300 hover:text-white p-2">
                <i data-lucide="x" class="w-8 h-8"></i>
            </button>
            <img id="modal-photo-img" src="" alt="Concert foto" class="max-h-[80vh] max-w-full rounded-2xl object-contain shadow-2xl">
            <p id="modal-photo-caption" class="text-slate-400 text-sm mt-3 text-center"></p>
        </div>
    </div>

    <!-- App Logic Script -->
    <script>
        // Default Mock Data if Storage is Empty
        const initialConcerts = [
            {
                id: '1',
                artist: 'Arctic Monkeys',
                venue: 'Rock Werchter',
                location: 'Werchter, België',
                date: '2023-07-02',
                rating: 5,
                notes: 'Geweldige headliner show op de Main Stage. "505" was het absolute hoogtepunt!',
                photos: []
            },
            {
                id: '2',
                artist: 'Fred again..',
                venue: 'Ancienne Belgique',
                location: 'Brussel, België',
                date: '2022-11-25',
                rating: 5,
                notes: 'Intieme sfeer, onwaarschijnlijke energie van het publiek.',
                photos: []
            }
        ];

        let concerts = JSON.parse(localStorage.getItem('jordy_concerts_data')) || initialConcerts;
        let currentTempPhotos = [];
        let photoFilterActive = false;

        // Initialize App
        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            renderConcerts();
            updateStats();
        });

        // Save State
        function saveData() {
            localStorage.setItem('jordy_concerts_data', JSON.stringify(concerts));
            updateStats();
        }

        // Render Concert Cards
        function renderConcerts() {
            const grid = document.getElementById('concerts-grid');
            const emptyState = document.getElementById('empty-state');
            const query = document.getElementById('search-input').value.toLowerCase();
            const sortBy = document.getElementById('sort-select').value;

            let filtered = concerts.filter(c => {
                const matchesSearch = c.artist.toLowerCase().includes(query) ||
                                      c.venue.toLowerCase().includes(query) ||
                                      (c.location && c.location.toLowerCase().includes(query)) ||
                                      (c.notes && c.notes.toLowerCase().includes(query));
                
                const matchesPhotoFilter = photoFilterActive ? (c.photos && c.photos.length > 0) : true;

                return matchesSearch && matchesPhotoFilter;
            });

            // Sorting
            filtered.sort((a, b) => {
                if (sortBy === 'date-desc') return new Date(b.date) - new Date(a.date);
                if (sortBy === 'date-asc') return new Date(a.date) - new Date(b.date);
                if (sortBy === 'rating-desc') return b.rating - a.rating;
                if (sortBy === 'artist-asc') return a.artist.localeCompare(b.artist);
                return 0;
            });

            if (filtered.length === 0) {
                grid.innerHTML = '';
                emptyState.classList.remove('hidden');
                return;
            }

            emptyState.classList.add('hidden');

            grid.innerHTML = filtered.map(c => `
                <div class="group bg-slate-900/80 border border-slate-800 hover:border-slate-700/80 rounded-3xl overflow-hidden transition duration-300 flex flex-col justify-between hover:shadow-xl hover:shadow-brand-500/5">
                    <div>
                        <!-- Header / Title -->
                        <div class="p-6 pb-4">
                            <div class="flex items-start justify-between gap-3 mb-2">
                                <h3 class="text-xl font-bold text-white group-hover:text-brand-400 transition truncate">${escapeHtml(c.artist)}</h3>
                                <div class="flex items-center text-amber-400 text-xs font-bold shrink-0 bg-amber-400/10 px-2 py-1 rounded-lg">
                                    ★ ${c.rating}/5
                                </div>
                            </div>
                            
                            <div class="space-y-1 text-xs text-slate-400">
                                <p class="flex items-center gap-1.5 font-medium text-slate-300">
                                    <i data-lucide="map-pin" class="w-3.5 h-3.5 text-slate-500"></i>
                                    ${escapeHtml(c.venue)} ${c.location ? `• <span class="text-slate-400">${escapeHtml(c.location)}</span>` : ''}
                                </p>
                                <p class="flex items-center gap-1.5">
                                    <i data-lucide="calendar" class="w-3.5 h-3.5 text-slate-500"></i>
                                    ${formatDate(c.date)}
                                </p>
                            </div>

                            ${c.notes ? `<p class="mt-4 text-xs text-slate-400 line-clamp-3 leading-relaxed bg-slate-950/50 p-3 rounded-xl border border-slate-800/50">${escapeHtml(c.notes)}</p>` : ''}
                        </div>

                        <!-- Photos Gallery Section -->
                        ${c.photos && c.photos.length > 0 ? `
                            <div class="px-6 pb-2">
                                <p class="text-[10px] font-semibold text-slate-500 uppercase tracking-wider mb-2">Foto's (${c.photos.length})</p>
                                <div class="flex gap-2 overflow-x-auto pb-2">
                                    ${c.photos.map((imgSrc, idx) => `
                                        <img src="${imgSrc}" onclick="openPhotoModal('${imgSrc}', '${escapeHtml(c.artist)} @ ${escapeHtml(c.venue)}')" class="w-16 h-16 object-cover rounded-xl border border-slate-800 hover:opacity-80 transition cursor-pointer shrink-0">
                                    `).join('')}
                                </div>
                            </div>
                        ` : ''}
                    </div>

                    <!-- Footer Actions -->
                    <div class="p-4 bg-slate-950/40 border-t border-slate-800/60 flex items-center justify-end gap-2">
                        <button onclick="openEditModal('${c.id}')" class="p-2 text-slate-400 hover:text-white rounded-lg hover:bg-slate-800 transition text-xs flex items-center gap-1.5 font-medium">
                            <i data-lucide="pencil" class="w-3.5 h-3.5"></i> Bewerken
                        </button>
                        <button onclick="deleteConcert('${c.id}')" class="p-2 text-red-400 hover:text-red-300 rounded-lg hover:bg-red-500/10 transition text-xs flex items-center gap-1.5 font-medium">
                            <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                        </button>
                    </div>
                </div>
            `).join('');

            lucide.createIcons();
        }

        // Statistics Calculator
        function updateStats() {
            document.getElementById('stat-total').innerText = concerts.length;

            const photosCount = concerts.filter(c => c.photos && c.photos.length > 0).length;
            document.getElementById('stat-with-photos').innerText = photosCount;

            // Most visited artist calculation
            const artistCounts = {};
            const venueCounts = {};

            concerts.forEach(c => {
                artistCounts[c.artist] = (artistCounts[c.artist] || 0) + 1;
                venueCounts[c.venue] = (venueCounts[c.venue] || 0) + 1;
            });

            const topArtist = Object.entries(artistCounts).sort((a,b) => b[1] - a[1])[0];
            const topVenue = Object.entries(venueCounts).sort((a,b) => b[1] - a[1])[0];

            document.getElementById('stat-top-artist').innerText = topArtist ? topArtist[0] : '-';
            document.getElementById('stat-top-venue').innerText = topVenue ? topVenue[0] : '-';
        }

        // Photo Upload Handling (Base64)
        function handlePhotoSelect(event) {
            const files = Array.from(event.target.files);
            
            files.forEach(file => {
                if (file.size > 3 * 1024 * 1024) {
                    alert('Afbeelding mag niet groter zijn dan 3MB.');
                    return;
                }

                const reader = new FileReader();
                reader.onload = (e) => {
                    currentTempPhotos.push(e.target.result);
                    renderFormPhotoPreviews();
                };
                reader.readAsDataURL(file);
            });
        }

        function renderFormPhotoPreviews() {
            const container = document.getElementById('form-photo-previews');
            container.innerHTML = currentTempPhotos.map((img, index) => `
                <div class="relative group w-14 h-14">
                    <img src="${img}" class="w-14 h-14 object-cover rounded-xl border border-slate-800">
                    <button type="button" onclick="removeTempPhoto(${index})" class="absolute -top-1.5 -right-1.5 bg-red-500 text-white rounded-full p-0.5 shadow hover:bg-red-600 transition">
                        <i data-lucide="x" class="w-3 h-3"></i>
                    </button>
                </div>
            `).join('');
            lucide.createIcons();
        }

        function removeTempPhoto(index) {
            currentTempPhotos.splice(index, 1);
            renderFormPhotoPreviews();
        }

        // Modal Controls
        function openAddModal() {
            document.getElementById('modal-title').innerText = 'Nieuw Concert Toevoegen';
            document.getElementById('concert-form').reset();
            document.getElementById('concert-id').value = '';
            currentTempPhotos = [];
            renderFormPhotoPreviews();
            showModal();
        }

        function openEditModal(id) {
            const c = concerts.find(item => item.id === id);
            if (!c) return;

            document.getElementById('modal-title').innerText = 'Concert Bewerken';
            document.getElementById('concert-id').value = c.id;
            document.getElementById('form-artist').value = c.artist;
            document.getElementById('form-venue').value = c.venue;
            document.getElementById('form-location').value = c.location || '';
            document.getElementById('form-date').value = c.date;
            document.getElementById('form-rating').value = c.rating;
            document.getElementById('form-notes').value = c.notes || '';
            
            currentTempPhotos = c.photos ? [...c.photos] : [];
            renderFormPhotoPreviews();
            showModal();
        }

        function showModal() {
            const modal = document.getElementById('concert-modal');
            const container = document.getElementById('modal-container');
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                container.classList.remove('scale-95');
                container.classList.add('scale-100');
            }, 10);
        }

        function closeModal() {
            const modal = document.getElementById('concert-modal');
            const container = document.getElementById('modal-container');
            container.classList.remove('scale-100');
            container.classList.add('scale-95');
            modal.classList.add('opacity-0');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 200);
        }

        // Form Submit
        function handleFormSubmit(event) {
            event.preventDefault();

            const id = document.getElementById('concert-id').value;
            const artist = document.getElementById('form-artist').value;
            const venue = document.getElementById('form-venue').value;
            const location = document.getElementById('form-location').value;
            const date = document.getElementById('form-date').value;
            const rating = parseInt(document.getElementById('form-rating').value);
            const notes = document.getElementById('form-notes').value;

            if (id) {
                // Update
                const index = concerts.findIndex(c => c.id === id);
                if (index !== -1) {
                    concerts[index] = { id, artist, venue, location, date, rating, notes, photos: currentTempPhotos };
                }
            } else {
                // Create
                const newConcert = {
                    id: Date.now().toString(),
                    artist,
                    venue,
                    location,
                    date,
                    rating,
                    notes,
                    photos: currentTempPhotos
                };
                concerts.unshift(newConcert);
            }

            saveData();
            renderConcerts();
            closeModal();
        }

        // Delete Entry
        function deleteConcert(id) {
            concerts = concerts.filter(c => c.id !== id);
            saveData();
            renderConcerts();
        }

        // Toggle Photo Filter
        function togglePhotoFilter() {
            photoFilterActive = !photoFilterActive;
            const btn = document.getElementById('photo-filter-btn');
            if (photoFilterActive) {
                btn.classList.add('bg-brand-500/20', 'border-brand-500', 'text-brand-400');
            } else {
                btn.classList.remove('bg-brand-500/20', 'border-brand-500', 'text-brand-400');
            }
            renderConcerts();
        }

        // Fullscreen Photo Modal
        function openPhotoModal(imgSrc, caption) {
            const modal = document.getElementById('photo-modal');
            document.getElementById('modal-photo-img').src = imgSrc;
            document.getElementById('modal-photo-caption').innerText = caption;
            modal.classList.remove('hidden');
            setTimeout(() => modal.classList.remove('opacity-0'), 10);
        }

        function closePhotoModal() {
            const modal = document.getElementById('photo-modal');
            modal.classList.add('opacity-0');
            setTimeout(() => modal.classList.add('hidden'), 200);
        }

        // Utilities
        function formatDate(dateStr) {
            if (!dateStr) return '';
            const date = new Date(dateStr);
            return date.toLocaleDateString('nl-BE', { day: 'numeric', month: 'short', year: 'numeric' });
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>"']/g, function(m) {
                return {
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    '"': '&quot;',
                    "'": '&#039;'
                }[m];
            });
        }
    </script>
</body>
</html>
